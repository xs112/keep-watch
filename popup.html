<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 330px; margin: 0; padding: 12px 14px; font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
  h1 { font-size: 15px; margin: 0 0 8px; display:flex; align-items:center; gap:6px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:5px 0; }
  .row label { flex:1; }
  .sub { color: var(--muted-foreground, #888); font-size:11px; margin:2px 0 8px; }
  input[type=text], input[type=password], select { width:100%; box-sizing:border-box; padding:4px 6px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  fieldset { border:1px solid var(--border,#ccc); border-radius:6px; margin:8px 0; padding:6px 10px; }
  legend { font-size:12px; font-weight:600; padding:0 4px; }
  button { padding:5px 10px; border-radius:5px; border:1px solid var(--border,#999); background:var(--card,#f4f4f4); color:var(--foreground,#000); cursor:pointer; font-size:12px; }
  button:hover { border-color:#7a5; }
  #status { font-size:11px; min-height:16px; color:#3a3; }
  .stat { font-size:11px; color: var(--muted-foreground,#888); }
  .switch { transform: scale(1.15); }
</style>
</head>
<body>
<h1>📺 keep-watch <span class="stat">v2.6.5</span></h1>

<div class="row"><b>总开关</b><input type="checkbox" id="enabled" class="switch"></div>
<div class="sub">关闭后仅保留防暂停，不再答题。右下角悬浮球也可点按暂停。</div>

<fieldset>
<legend>答题设置</legend>
  <div class="row" style="background:#1f3a5f;border-radius:6px;padding:6px 8px;margin-bottom:6px"><label style="color:#cfe3ff;font-weight:700">🎯 只刷课模式（遇题跳过，只看视频并持续连播）</label><input type="checkbox" id="videoOnly" class="switch"></div>
  <div class="sub" id="videoOnlyHint" style="display:none;color:#8fc0ff">已开启：不答任何题，视频弹题会被关掉，自动跳过作业/测验/文档节，只挑视频节持续播放。</div>
  <div class="row"><label>自动答题</label><input type="checkbox" id="autoAnswer" class="switch"></div>
  <div class="row"><label>选中后自动点"提交"</label><input type="checkbox" id="autoSubmit" class="switch"></div>
  <div class="row"><label>看完本节自动播放下一节</label><input type="checkbox" id="autoNext" class="switch"></div>
  <div class="row"><label>演练模式（只标记不点击）</label><input type="checkbox" id="dryRun" class="switch"></div>
  <div class="row"><label>仅在挂课平台启用</label><input type="checkbox" id="onlyPlatforms" class="switch"></div>
</fieldset>

<fieldset>
<legend>答案来源（按顺序尝试）</legend>
  <div class="row"><label>① 页面内嵌答案</label><input type="checkbox" id="usePage" class="switch"></div>
  <div class="row"><label>② 本地题库（自动积累）</label><input type="checkbox" id="useBank" class="switch"></div>
  <div class="row"><label>③ AI 大模型</label><input type="checkbox" id="useAI" class="switch"></div>
  <div class="row"><label>答过的题自动存入题库</label><input type="checkbox" id="autoLearn" class="switch"></div>
</fieldset>

<fieldset>
<legend>AI 接口（OpenAI 兼容）</legend>
  <div class="grid2">
    <select id="aiProvider">
      <option value="deepseek">DeepSeek</option>
      <option value="volc">火山方舟(豆包/Code)</option>
      <option value="moonshot">Kimi(Moonshot)</option>
      <option value="zhipu">智谱 GLM</option>
      <option value="dashscope">阿里通义</option>
      <option value="openai">OpenAI</option>
      <option value="openrouter">OpenRouter</option>
      <option value="custom">自定义</option>
    </select>
    <input type="text" id="aiModel" placeholder="模型名">
  </div>
  <input type="text" id="aiBase" placeholder="API Base URL" style="margin-top:6px">
  <input type="password" id="aiKey" placeholder="API Key（只存在本地）" style="margin-top:6px">
  <div class="sub">Key 仅保存在浏览器本地存储，由后台脚本发起请求，课程页面无法读取。</div>
</fieldset>

<fieldset>
<legend>本地题库 <span id="bankCount" class="stat"></span></legend>
  <div class="grid2">
    <button id="exportBank">导出 JSON</button>
    <button id="importBank">导入 JSON</button>
    <button id="mergeBank" style="grid-column:1/3">追加合并他人题库文件</button>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
</fieldset>

<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
